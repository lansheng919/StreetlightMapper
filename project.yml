name: StreetlightMapper
options:
  bundleIdPrefix: com.slmapper
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

targets:
  StreetlightMapper:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: StreetlightMapper/Resources/Info.plist
      properties:
        CFBundleDisplayName: StreetlightMapper
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: StreetlightMapper uses the camera to scan Pole ID labels and street light QR codes.
        NSLocalNetworkUsageDescription: StreetlightMapper hosts a local REST API so external systems (e.g. SAP) can retrieve captured data over the local network.
        NSBonjourServices:
          - _http._tcp
    sources:
      - path: StreetlightMapper
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slmapper.StreetlightMapper
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""        # set your team ID here
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: StreetlightMapper/Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
