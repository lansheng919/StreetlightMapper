name: StreetlightMapper
options:
  bundleIdPrefix: com.slmapper
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

targets:
  StreetlightMapper:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: StreetlightMapper/Resources/Info.plist
    sources:
      - path: StreetlightMapper
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slmapper.StreetlightMapper
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""        # set your team ID here
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: StreetlightMapper/Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
